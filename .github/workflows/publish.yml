name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Lets npm authenticate the workflow without a token (trusted publishing)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm publish
